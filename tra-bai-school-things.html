<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d62d77">
  <title>FF2 - Unit 1: School things - Trả bài</title>
  <style>
    :root{--ink:#19202a;--muted:#68707d;--paper:#fff;--canvas:#f2f5f7;--line:#dce2e7;--pink:#d62d77;--pink2:#ad1758;--navy:#213c62}
    *{box-sizing:border-box}
    html,body{min-width:320px;min-height:100%;margin:0}
    body{background:var(--canvas);color:var(--ink);font-family:Arial,"Segoe UI",sans-serif;letter-spacing:0}
    button{font:inherit;color:inherit}
    .shell{width:min(100%,920px);min-height:100vh;margin:auto;display:grid;grid-template-rows:auto 1fr}
    header{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 24px;background:#fff;border-bottom:1px solid var(--line)}
    .brand{min-width:0;display:flex;flex:1 1 auto;align-items:center;gap:11px}.brand>div{min-width:0}
    .mark{width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;border-radius:7px;background:var(--pink);color:#fff;font-size:15px;font-weight:900}
    h1{margin:0;font-size:18px;line-height:1.15}
    .sub{margin:0 0 2px;color:var(--pink2);font-size:11px;font-weight:900;text-transform:uppercase}
    .count{font-size:14px;color:var(--muted)}.count b{color:var(--ink);font-size:21px}
    main{min-height:0;padding:18px 20px 22px;display:grid;grid-template-rows:auto 1fr auto;gap:14px}
    .progress{height:5px;overflow:hidden;border-radius:3px;background:#dce2e7}.progress i{height:100%;display:block;background:var(--pink);transition:width .2s}
    .stage{min-height:0;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:14px}
    .nav{width:46px;height:52px;border:1px solid #cbd3da;border-radius:7px;background:#fff;color:var(--navy);font-size:30px;line-height:1;cursor:pointer}
    .card{height:min(70vh,650px);min-height:450px;display:grid;grid-template-rows:1fr auto;overflow:hidden;border:1px solid #d3d9df;border-radius:8px;background:#fff;box-shadow:0 12px 34px rgb(35 49 62/.1);touch-action:pan-y}
    .picture{min-height:0;display:grid;place-items:center;padding:20px;background:linear-gradient(90deg,rgb(33 60 98/.05) 1px,transparent 1px),linear-gradient(rgb(33 60 98/.05) 1px,transparent 1px),#fbfcfd;background-size:28px 28px}
    .picture img{width:min(100%,500px);height:auto;display:block;object-fit:contain;user-select:none}
    .prompt{min-height:142px;display:grid;place-items:center;border-top:1px solid var(--line);padding:18px}
    .letter{margin:0;color:var(--pink2);font-size:72px;font-weight:900;line-height:1}.letter span{color:#8c95a0}
    .controls{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}
    .controls button{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border:1px solid #cbd3da;border-radius:6px;background:#fff;color:var(--navy);cursor:pointer;font-weight:800}
    .dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.dots button{width:31px;height:31px;padding:0;border:1px solid #cbd3da;border-radius:5px;background:#fff;color:#6b7480;cursor:pointer;font-size:12px;font-weight:800}.dots button.on{border-color:var(--pink);background:var(--pink);color:#fff}
    button:focus-visible{outline:3px solid #f2ba10;outline-offset:3px}
    @media(max-width:600px){
      header{min-height:62px;padding:8px 12px}.mark{width:38px;height:38px;font-size:15px}h1{max-width:calc(100vw - 140px);font-size:14px;line-height:1.15}.sub{font-size:9px}
      main{padding:12px 9px 17px;gap:10px}.stage{grid-template-columns:34px minmax(0,1fr) 34px;gap:4px}.nav{width:32px;height:48px;font-size:25px}
      .card{height:min(72vh,590px);min-height:420px}.picture{padding:10px;background-size:22px 22px}.prompt{min-height:125px}.letter{font-size:62px}
      .controls button{padding:8px 11px}.dots{gap:4px}.dots button{width:27px;height:27px}
    }
  </style>
</head>

    let order=items.map((_,i)=>i),current=0,touchStart=null;
    const art=document.querySelector("#art"),letter=document.querySelector("#letter"),number=document.querySelector("#number"),progress=document.querySelector("#progress"),dots=document.querySelector("#dots"),card=document.querySelector("#card");
    function render(){
      const item=items[order[current]];
      art.src=item.src;letter.innerHTML=item.i+"<span>…</span>";number.textContent=current+1;progress.style.width=((current+1)/order.length*100)+"%";
      dots.innerHTML=order.map((_,i)=>'<button class="'+(i===current?"on":"")+'" data-i="'+i+'" aria-label="Từ '+(i+1)+'">'+(i+1)+"</button>").join("");
      dots.querySelectorAll("button").forEach(button=>button.onclick=()=>{current=Number(button.dataset.i);render()});
    }
    function move(step){current=(current+step+order.length)%order.length;render()}
    document.querySelector("#prev").onclick=()=>move(-1);document.querySelector("#next").onclick=()=>move(1);
    document.querySelector("#shuffle").onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}current=0;render()};
    document.querySelector("#reset").onclick=()=>{order=items.map((_,i)=>i);current=0;render()};
    card.addEventListener("touchstart",event=>{touchStart=event.changedTouches[0]?.clientX??null},{passive:true});
    card.addEventListener("touchend",event=>{if(touchStart===null)return;const end=event.changedTouches[0]?.clientX??touchStart,distance=end-touchStart;touchStart=null;if(Math.abs(distance)>=45)move(distance<0?1:-1)},{passive:true});
    document.addEventListener("keydown",event=>{if(event.key==="ArrowLeft")move(-1);if(event.key==="ArrowRight")move(1)});
    render();
  </script>
